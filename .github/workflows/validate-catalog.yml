name: Validate Catalog

on:
  pull_request:
    paths: ["catalog/**", "scripts/validate-catalog.mjs", "docs/docs/apps/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:catalog
